name: Validate current CDC source files

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Pull, validate, and build NHANES data
        run: >-
          Rscript scripts/run_pipeline.R
          --cache-dir=data/raw
          --output-dir=artifacts
          --refresh=true
          --write-csv=false
      - name: Upload validated research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-validated-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
