project:
  type: website
  output-dir: _site

  render:
    - index.qmd

    - foundations/index.qmd
    - foundations/data-structure.qmd
    - foundations/survey-design.qmd
    - foundations/survey-weights.qmd
    - foundations/combining-cycles.qmd

    - laboratory/index.qmd
    - laboratory/component-catalog.qmd

    - pipelines/index.qmd
    - pipelines/cbc-demographics/index.qmd

    - tutorials/index.qmd

    - tutorial/index.qmd
    - tutorial/01-welcome.qmd
    - tutorial/02-install-r-vscode.qmd
    - tutorial/03-create-project.qmd
    - tutorial/04-install-packages.qmd
    - tutorial/05-understand-nhanes.qmd
    - tutorial/06-define-source-catalog.qmd
    - tutorial/07-download-one-file.qmd
    - tutorial/08-download-all-files.qmd
    - tutorial/09-inspect-data.qmd
    - tutorial/10-handle-duplicates.qmd
    - tutorial/11-combine-components.qmd
    - tutorial/12-merge-data.qmd
    - tutorial/13-validate-results.qmd
    - tutorial/14-label-variables.qmd
    - tutorial/15-save-outputs.qmd
    - tutorial/16-analyze-hemoglobin.qmd
    - tutorial/17-create-graph.qmd
    - tutorial/18-full-script.qmd
    - tutorial/19-troubleshooting.qmd
    - tutorial/20-completion.qmd

    - NhanesDownloadScripts.qmd

  resources:
    - assets/**
    - outputs/sample/**
    - scripts/**
    - config/**

website:
  title: "NHANES Laboratory Data Pipeline in R"

  description: >-
    Reproducible R workflows, documentation, and tutorials for acquiring,
    validating, harmonizing, merging, and analyzing NHANES laboratory data
    with the supporting data required for valid analysis.

  site-url: "https://simonaseno.github.io/NHANES/"
  repo-url: "https://github.com/simonaseno/NHANES"
  repo-actions:
    - source
    - issue

  image: "assets/nhanes-pipeline.jpg"

  open-graph:
    locale: en_US
    site-name: "NHANES Laboratory Data Pipeline in R"

  twitter-card: true

  navbar:
    pinned: true
    background: "#06283D"
    foreground: light
    search: true

    left:
      - href: index.qmd
        text: "Overview"

      - text: "Understanding NHANES"
        menu:
          - href: foundations/index.qmd
            text: "Start here"
          - href: foundations/data-structure.qmd
            text: "NHANES data structure"
          - href: foundations/survey-design.qmd
            text: "Survey design"
          - href: foundations/survey-weights.qmd
            text: "Survey weights"
          - href: foundations/combining-cycles.qmd
            text: "Combining cycles"

      - text: "Laboratory data"
        menu:
          - href: laboratory/index.qmd
            text: "Laboratory data overview"
          - href: laboratory/component-catalog.qmd
            text: "Component catalog"

      - text: "Pipelines"
        menu:
          - href: pipelines/index.qmd
            text: "Pipeline overview"
          - href: pipelines/cbc-demographics/index.qmd
            text: "CBC and Demographics"

      - text: "Tutorials"
        menu:
          - href: tutorials/index.qmd
            text: "Tutorial catalog"
          - href: tutorial/index.qmd
            text: "CBC tutorial"

      - href: NhanesDownloadScripts.qmd
        text: "Technical guide"

    right:
      - icon: github
        href: "https://github.com/simonaseno/NHANES"
        aria-label: "View the project on GitHub"

  sidebar:
    - id: foundations
      title: "Understanding NHANES"
      style: docked
      collapse-level: 2
      contents:
        - href: foundations/index.qmd
          text: "Foundations overview"
        - href: foundations/data-structure.qmd
          text: "NHANES data structure"
        - href: foundations/survey-design.qmd
          text: "Survey design"
        - href: foundations/survey-weights.qmd
          text: "Survey weights"
        - href: foundations/combining-cycles.qmd
          text: "Combining cycles"

    - id: laboratory
      title: "NHANES Laboratory Data"
      style: docked
      collapse-level: 2
      contents:
        - href: laboratory/index.qmd
          text: "Laboratory data overview"
        - href: laboratory/component-catalog.qmd
          text: "Laboratory component catalog"

        - section: "Available pipeline"
          contents:
            - href: pipelines/cbc-demographics/index.qmd
              text: "CBC and Demographics"

        - section: "Related foundations"
          contents:
            - href: foundations/data-structure.qmd
              text: "NHANES data structure"
            - href: foundations/survey-weights.qmd
              text: "Survey weights"
            - href: foundations/combining-cycles.qmd
              text: "Combining cycles"

    - id: tutorials
      title: "CBC and Demographics Tutorial"
      style: docked
      collapse-level: 2
      contents:
        - href: tutorial/index.qmd
          text: "Tutorial overview"

        - section: "Getting started"
          contents:
            - href: tutorial/01-welcome.qmd
              text: "Lesson 1: Welcome and course overview"
            - href: tutorial/02-install-r-vscode.qmd
              text: "Lesson 2: Install R and Visual Studio Code"
            - href: tutorial/03-create-project.qmd
              text: "Lesson 3: Create the R project"
            - href: tutorial/04-install-packages.qmd
              text: "Lesson 4: Install the required R packages"
            - href: tutorial/05-understand-nhanes.qmd
              text: "Lesson 5: Understand NHANES data"

        - section: "Acquire the data"
          contents:
            - href: tutorial/06-define-source-catalog.qmd
              text: "Lesson 6: Define the source-file catalog"
            - href: tutorial/07-download-one-file.qmd
              text: "Lesson 7: Download one NHANES file"
            - href: tutorial/08-download-all-files.qmd
              text: "Lesson 8: Download all required files"
            - href: tutorial/09-inspect-data.qmd
              text: "Lesson 9: Inspect the downloaded data"

        - section: "Build and validate"
          contents:
            - href: tutorial/10-handle-duplicates.qmd
              text: "Lesson 10: Handle duplicate records"
            - href: tutorial/11-combine-components.qmd
              text: "Lesson 11: Combine files within components"
            - href: tutorial/12-merge-data.qmd
              text: "Lesson 12: Merge CBC and Demographic data"
            - href: tutorial/13-validate-results.qmd
              text: "Lesson 13: Validate the merged results"
            - href: tutorial/14-label-variables.qmd
              text: "Lesson 14: Create readable variable labels"
            - href: tutorial/15-save-outputs.qmd
              text: "Lesson 15: Save reusable outputs"

        - section: "Analyze and communicate"
          contents:
            - href: tutorial/16-analyze-hemoglobin.qmd
              text: "Lesson 16: Analyze hemoglobin data"
            - href: tutorial/17-create-graph.qmd
              text: "Lesson 17: Create and save the graph"

        - section: "Complete the course"
          contents:
            - href: tutorial/18-full-script.qmd
              text: "Lesson 18: Run the complete pipeline"
            - href: tutorial/19-troubleshooting.qmd
              text: "Lesson 19: Troubleshoot common problems"
            - href: tutorial/20-completion.qmd
              text: "Lesson 20: Completion and next steps"

  page-footer:
    border: false
    background: "#041F30"
    foreground: light

    left: "© 2026 Simon Aseno · MIT licensed"

    center: >-
      Reproducible R infrastructure for NHANES laboratory data.

    right:
      - text: "Source"
        href: "https://github.com/simonaseno/NHANES"
      - text: "Report an issue"
        href: "https://github.com/simonaseno/NHANES/issues"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true

execute:
  freeze: auto